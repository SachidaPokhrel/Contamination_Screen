name: Repository checks
on: [push, pull_request]
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic and control tests (no biological reruns)
        run: bash tests/test_pipeline.sh
      - name: Rebuild evidence report
        run: python3 scripts/build_report.py
      - name: Validate retained artifacts and HTML
        run: python3 scripts/validate_repository.py
